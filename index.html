<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Nunito:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
.w{width:100%;height:690px;position:relative;overflow:hidden;border-radius:18px;font-family:'Nunito',sans-serif;}

/* ===== ФОН: многослойный, живой, со светом ===== */
.bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(160,100,255,0.28) 0%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(80,180,255,0.22) 0%, transparent 50%),
    radial-gradient(ellipse 70% 55% at 65% 80%, rgba(60,220,160,0.18) 0%, transparent 52%),
    radial-gradient(ellipse 50% 40% at 15% 75%, rgba(255,140,80,0.16) 0%, transparent 48%),
    radial-gradient(ellipse 90% 80% at 50% 50%, rgba(30,20,80,0.0) 0%, transparent 100%),
    linear-gradient(145deg, #0e0820 0%, #0a1535 22%, #071e2e 42%, #0b2520 60%, #130e1e 80%, #0e0820 100%);
  overflow:hidden;
}
/* Медленно вращающееся сияние */
.bg::before{
  content:'';position:absolute;
  inset:-60%;width:220%;height:220%;
  background:conic-gradient(
    from 0deg at 45% 48%,
    rgba(140,70,230,0.22) 0deg,
    rgba(50,150,255,0.26) 55deg,
    rgba(30,220,180,0.20) 110deg,
    rgba(100,230,80,0.10) 165deg,
    rgba(255,180,40,0.14) 210deg,
    rgba(255,80,140,0.18) 265deg,
    rgba(140,70,230,0.22) 360deg
  );
  animation:bgSpin 24s linear infinite;
  filter:blur(40px);
  opacity:0.85;
}
/* Пульсирующие цветные пятна поверх */
.bg::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 55% 35% at 28% 35%, rgba(180,120,255,0.20) 0%, transparent 100%),
    radial-gradient(ellipse 45% 30% at 72% 25%, rgba(80,200,255,0.16) 0%, transparent 100%),
    radial-gradient(ellipse 40% 28% at 60% 78%, rgba(80,230,170,0.14) 0%, transparent 100%),
    radial-gradient(ellipse 38% 25% at 15% 68%, rgba(255,160,60,0.12) 0%, transparent 100%);
  animation:bgPulse 9s ease-in-out infinite alternate;
}
@keyframes bgSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes bgPulse{0%{opacity:0.55;}100%{opacity:1.0;}}

/* Центральный рассеянный свет */
.bg-light{
  position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse 60% 50% at 50% 50%, rgba(220,200,255,0.10) 0%, transparent 65%);
  pointer-events:none;
}

.paths-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}

.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:8;pointer-events:none;width:164px;height:164px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.center-disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(255,252,255,0.13) 0%,rgba(180,140,255,0.08) 55%,transparent 100%);border:1.5px solid rgba(210,180,255,0.45);backdrop-filter:blur(10px);box-shadow:0 0 32px rgba(160,100,255,0.18),inset 0 0 20px rgba(255,255,255,0.04);}
.c-title{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:300;color:#f2ecff;letter-spacing:0.04em;line-height:1.1;position:relative;z-index:2;text-shadow:0 0 22px rgba(200,160,255,0.65),0 2px 8px rgba(0,0,0,0.5);}
.c-sub{font-size:8.5px;color:#b8a0d8;letter-spacing:0.16em;text-transform:uppercase;margin-top:4px;position:relative;z-index:2;}
.c-tag{font-family:'Cormorant Garamond',serif;font-size:10.5px;font-style:italic;color:#cdb8ee;margin-top:7px;line-height:1.5;position:relative;z-index:2;}
.c-heart{color:#ff80c0;font-size:13px;margin-top:5px;position:relative;z-index:2;animation:hbeat 3s ease-in-out infinite;}
@keyframes hbeat{0%,100%{text-shadow:0 0 8px rgba(255,100,180,0.55);}50%{text-shadow:0 0 20px rgba(255,100,180,1.0),0 0 38px rgba(255,100,180,0.35);}}

.room{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:12;transition:transform 0.32s ease;}
.room:hover{transform:translate(-50%,-50%) scale(1.1);}
.room-clip-wrap{position:relative;}
.room-photo{width:100%;height:100%;background-size:cover;background-position:center;transition:filter 0.3s ease;}
.room-color-layer{position:absolute;inset:0;transition:opacity 0.3s ease;}
.room:hover .room-color-layer{opacity:0.2!important;}
.room-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9.5px;font-weight:600;color:#e4d4ff;text-shadow:0 1px 4px rgba(0,0,0,0.85),0 0 10px rgba(160,110,255,0.4);letter-spacing:0.03em;pointer-events:none;}
.room-glow{position:absolute;inset:-6px;border-radius:inherit;opacity:0;transition:opacity 0.3s;background:radial-gradient(circle,rgba(255,220,120,0.4),transparent 70%);z-index:-1;filter:blur(6px);}
.room:hover .room-glow{opacity:1;}

.footstep{position:absolute;width:5px;height:8px;border-radius:40% 40% 50% 50%;background:rgba(200,160,255,0.9);pointer-events:none;transform:translate(-50%,-50%);opacity:0;box-shadow:0 0 5px rgba(200,160,255,0.95),0 0 10px rgba(200,160,255,0.45);z-index:6;}

.tooltip{position:fixed;background:rgba(18,10,40,0.95);border:1px solid rgba(180,140,255,0.35);border-radius:12px;padding:11px 15px;max-width:210px;z-index:400;box-shadow:0 10px 34px rgba(0,0,0,0.55);pointer-events:none;opacity:0;transition:opacity 0.16s;backdrop-filter:blur(8px);}
.tooltip.vis{opacity:1;}
.tt-head{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:500;color:#e8d8ff;margin-bottom:4px;}
.tt-body{font-size:11px;color:#b0a0cc;line-height:1.6;}

/* ===== МОДАЛ с живым фото ===== */
.modal-bg{position:fixed;inset:0;background:rgba(8,4,20,0.72);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.28s;backdrop-filter:blur(6px);}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{background:linear-gradient(160deg,#18102e,#1a1530);border:1px solid rgba(180,140,255,0.25);border-radius:22px;max-width:360px;width:91%;position:relative;overflow:hidden;transform:translateY(18px) scale(0.94);transition:transform 0.28s;box-shadow:0 24px 70px rgba(0,0,0,0.7),0 0 60px rgba(120,80,220,0.12);}
.modal-bg.open .modal{transform:translateY(0) scale(1);}
.modal-hero{
  width:100%;height:200px;
  background-size:cover;background-position:center;
  position:relative;
  transition:background-image 0.3s;
}
.modal-hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(18,10,40,0.95) 100%);
}
.modal-body{padding:14px 24px 26px;}
.modal-ico{font-size:26px;margin-bottom:6px;}
.modal-tit{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:#e8dcff;margin-bottom:8px;text-shadow:0 0 20px rgba(180,140,255,0.3);}
.modal-txt{font-size:12.5px;color:#a898c8;line-height:1.8;}
.modal-close{position:absolute;top:10px;right:12px;background:rgba(30,20,60,0.88);border:1px solid rgba(180,140,255,0.3);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#c0a8e8;cursor:pointer;z-index:10;transition:background 0.18s;}
.modal-close:hover{background:rgba(80,50,140,0.7);}

.legend{position:absolute;bottom:12px;right:14px;font-size:9px;color:#7060a0;line-height:2.1;letter-spacing:0.04em;}
.leg-row{display:flex;align-items:center;gap:5px;justify-content:flex-end;}
.fs-dot{display:inline-block;width:4px;height:6px;border-radius:40%;background:rgba(200,160,255,0.9);box-shadow:0 0 4px rgba(200,160,255,0.8);}
</style>

<div class="w" id="W">
  <div class="bg"></div>
  <div class="bg-light"></div>
  <svg class="paths-svg" id="SVG" viewBox="0 0 680 690">
    <defs id="DEFS"></defs>
  </svg>
  <div class="center">
    <div class="center-disc"></div>
    <div class="c-title">Между<br>Мирами</div>

  </div>
  <div class="legend">
    <div class="leg-row"><span class="fs-dot"></span><span class="fs-dot" style="opacity:.5"></span><span class="fs-dot" style="opacity:.2"></span> Следы Пути</div>
  </div>
</div>

<div class="modal-bg" id="MOD">
  <div class="modal">
    <button class="modal-close" id="MX">✕</button>
    <div class="modal-hero" id="MHERO"></div>
    <div class="modal-body">
      <div class="modal-ico" id="MICO"></div>
      <div class="modal-tit" id="MTIT"></div>
      <div class="modal-txt" id="MTXT"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="TT">
  <div class="tt-head" id="TH"></div>
  <div class="tt-body" id="TB"></div>
</div>

<script>

  },

   photo:'https://picsum.photos/seed/library42/700/400',
   px:0.40,py:0.09, w:102,h:88,
   shape:'M10,30 C15,8 42,2 65,6 C85,10 102,22 100,44 C98,64 80,86 55,87 C30,88 2,70 4,48 C5,40 7,36 10,30Z',
   bg:'radial-gradient(circle at 50% 40%, #87ceeb 0%, #4a90d9 30%, #2c5f8a 65%, #1a3a5c 100%)',
   color:'rgba(20,50,100,0.4)'
  },
  {id:'win',icon:'🪟',name:'Окна в Другие Миры',
   desc:'Шары над улицей, другие небеса.',
   full:'Место для полёта фантазий, здесь можно увидеть создание и развитие других миров, вступить в контакт с иными цивилизациями и наладить связи.',
   photo:'https://picsum.photos/seed/cosmos77/700/400',
   px:0.73,py:0.13, w:98,h:100,
   shape:'M49,3 C70,1 95,16 96,40 C98,62 86,90 68,97 C52,103 28,95 14,78 C2,62 0,38 8,20 C16,4 32,4 49,3Z',
   bg:'radial-gradient(circle at 50% 35%, #87ceeb 0%, #5ba3d0 25%, #3a7abf 55%, #1c4a8c 100%)',
   color:'rgba(30,60,140,0.38)'
  },
  {id:'game',icon:'🎲',name:'Игровая Реальности',
   desc:'Замки, пальмы, лёгкость акробата.',
   full:'Где так легко поиграть с реальностью? В игровой форме, можно с лёгкостью акробата прыгать с ветки на ветку реальности, расширяя горизонты!',
   photo:'https://picsum.photos/seed/playful88/700/400',
   px:0.88,py:0.42, w:94,h:98,
   shape:'M47,2 C64,0 88,10 93,32 C98,52 90,80 70,92 C52,102 24,96 10,76 C-2,58 0,28 16,14 C28,4 34,3 47,2Z',

   color:'rgba(140,90,0,0.42)'
  },
  {id:'wish',icon:'🌼',name:'Комната Желаний',
   desc:'Следы на песке. Космос за порогом.',
   full:'Мы позволяем Быть всем нашим Желаниям — самым дерзким и смелым, самым простым и приземлённым, самым невероятным и нелогичным — без условий, без оценки!',
   photo:'https://picsum.photos/seed/stardream/700/400',
   px:0.63,py:0.90, w:100,h:94,
   shape:'M50,2 C72,2 96,20 96,46 C96,72 76,92 50,94 C24,92 4,72 4,46 C4,20 28,2 50,2Z',
   bg:'radial-gradient(circle at 45% 30%, #f5e06a 0%, #e8a020 25%, #c85000 50%, #1a0a40 75%, #050010 100%)',
   color:'rgba(80,20,120,0.45)'
  },
  {id:'sil',icon:'🪐',name:'Комната Тишины',
   desc:'Закат над озером. Тишина и глубина.',
   full:'Хочешь побыть одному и помедитировать в тишине — прекрасно, это комната как раз для этого, здесь есть вопросы, глубина Вечности и Тишина.',
   photo:'https://picsum.photos/seed/silence33/700/400',
   px:0.37,py:0.91, w:106,h:88,
   shape:'M8,30 C20,8 50,0 80,6 C102,12 108,32 104,52 C100,70 80,88 52,88 C26,88 2,72 4,50 C5,42 6,36 8,30Z',

  },
  {id:'gar',icon:'🌿',name:'Сад Возможностей',
   desc:'Жёлтые цветы в ящиках. Идеи прорастают.',
   full:'Хочешь посадить какую-то идею и увидеть, что из неё вырастит? Отлично, это то самое место, где будут прорастать идеи, наброски и черновики реальностей...',
   photo:'https://picsum.photos/seed/garden66/700/400',
   px:0.13,py:0.82, w:92,h:98,
   shape:'M46,2 C70,0 90,22 90,50 C90,76 70,98 46,98 C22,98 4,76 4,50 C4,24 22,4 46,2Z',
   bg:'radial-gradient(circle at 40% 40%, #f5e840 0%, #d4b800 25%, #8a7200 50%, #4a4a10 80%, #2a2c08 100%)',
   color:'rgba(50,80,10,0.45)'
  },
  {id:'mas',icon:'🎨',name:'Мастерская Творца',
   desc:'Камушки с рисунками. Творец в Потоке.',
   full:'Здесь можно увидеть различные работы, историю их создания и прикоснуться к Чувствам Творца в Едином Потоке, а также наблюдать процесс создания Нового.',
   photo:'https://picsum.photos/seed/artflow/700/400',
   px:0.09,py:0.50, w:94,h:96,
   shape:'M30,4 C50,0 80,8 90,28 C100,48 90,80 68,92 C48,102 14,94 5,70 C-2,50 4,20 18,10 C22,6 26,5 30,4Z',
   bg:'radial-gradient(circle at 50% 55%, #d0b090 0%, #a07850 30%, #785030 60%, #4a2810 100%)',
   color:'rgba(100,50,20,0.45)'
  }
];

let W,ww,wh,cx,cy,fsPool=[];

function rp(r){return{x:r.px*ww,y:r.py*wh};}

function init(){
  W=document.getElementById('W');
  ww=W.offsetWidth; wh=W.offsetHeight;
  cx=ww*0.5; cy=wh*0.5;
  buildClipPaths();
  drawPaths();
  placeRooms();
  buildFootstepPool();
}

function buildClipPaths(){
  const defs=document.getElementById('DEFS');
  let html='';
  rooms.forEach(r=>{
    html+=`<clipPath id="clip-${r.id}"><path d="${r.shape}"/></clipPath>`;
  });
  defs.innerHTML=html;
}

function drawPaths(){
  const svg=document.getElementById('SVG');
  svg.setAttribute('viewBox',`0 0 ${ww} ${wh}`);
  let d='';
  rooms.forEach(r=>{
    const p=rp(r);
    const mx=(cx+p.x)/2,my=(cy+p.y)/2;
    const dx=(p.y-cy)*0.13,dy=(cx-p.x)*0.13;
    d+=`<path d="M${cx},${cy} Q${mx+dx},${my+dy} ${p.x},${p.y}" stroke="rgba(180,140,255,0.22)" stroke-width="1.5" fill="none" stroke-dasharray="3,7"/>`;
  });
  const existing=svg.innerHTML;
  svg.innerHTML=existing+d;
}

function buildFootstepPool(){
  for(let i=0;i<100;i++){
    const el=document.createElement('div');
    el.className='footstep';
    W.appendChild(el);
    fsPool.push(el);
  }
}

const active={};
function bezier(t,a,b,c){
  const m=1-t;
  return{x:m*m*a.x+2*m*t*b.x+t*t*c.x,y:m*m*a.y+2*m*t*b.y+t*t*c.y};
}

function walkTo(room){
  if(active[room.id])return;
  active[room.id]=true;
  const p=rp(room);
  const p0={x:cx,y:cy},p1={x:p.x,y:p.y};
  const mx=(cx+p.x)/2,my=(cy+p.y)/2;
  const dx=(p.y-cy)*0.13,dy=(cx-p.x)*0.13;
  const cp={x:mx+dx,y:my+dy};
  const N=20; const used=[];
  let i=0;
  function step(){
    if(i>=N){
      setTimeout(()=>{used.forEach(e=>{e.style.opacity='0';});active[room.id]=false;},700);
      return;
    }
    const t=i/(N-1);
    const pos=bezier(t,p0,cp,p1);
    const el=fsPool[i%fsPool.length];
    used.push(el);
    const side=(i%2===0?-5:5)+(Math.random()-0.5)*3;
    const rot=(Math.random()-0.5)*25;
    el.style.cssText=`left:${pos.x+side}px;top:${pos.y}px;transform:translate(-50%,-50%) rotate(${rot}deg);opacity:0;transition:opacity 0.12s ease;`;
    void el.offsetWidth;
    el.style.opacity='1';
    i++;
    setTimeout(step,i<N/2?38:50);
  }
  step();
}

function placeRooms(){
  document.querySelectorAll('.room').forEach(e=>e.remove());
  rooms.forEach(r=>{
    const p=rp(r);
    const el=document.createElement('div');
    el.className='room';
    el.style.cssText=`left:${p.x}px;top:${p.y}px;`;
    el.innerHTML=`
      <div class="room-clip-wrap" style="width:${r.w}px;height:${r.h}px;position:relative;">
        <svg width="${r.w}" height="${r.h}" style="position:absolute;inset:0;z-index:0;" viewBox="0 0 ${r.w} ${r.h}">
          <defs><clipPath id="lc-${r.id}"><path d="${r.shape}"/></clipPath></defs>
          <g clip-path="url(#lc-${r.id})">
            <foreignObject width="${r.w}" height="${r.h}">
              <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;background:${r.bg};"></div>
            </foreignObject>
          </g>
          <g clip-path="url(#lc-${r.id})">
            <rect width="${r.w}" height="${r.h}" fill="${r.color}"/>
          </g>
          <g clip-path="url(#lc-${r.id})">
            <rect width="${r.w}" height="${r.h}" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
          </g>
          <g clip-path="url(#lc-${r.id})">
            <ellipse cx="${r.w*0.35}" cy="${r.h*0.3}" rx="${r.w*0.22}" ry="${r.h*0.16}" fill="rgba(255,255,255,0.10)"/>
          </g>
        </svg>
        <div class="room-glow" style="clip-path:path('${r.shape}');"></div>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;">
          <span style="font-size:22px;filter:drop-shadow(0 1px 5px rgba(0,0,0,0.7));">${r.icon}</span>
          <span style="font-size:9px;font-weight:600;color:#fff;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,0.85);margin-top:3px;padding:0 6px;line-height:1.25;">${r.name}</span>
        </div>
      </div>`;

    el.addEventListener('mouseenter',e=>{walkTo(r);showTT(e,r);});
    el.addEventListener('mousemove',moveTT);
    el.addEventListener('mouseleave',hideTT);
    el.addEventListener('click',()=>openMod(r));
    W.appendChild(el);
  });
}

const tt=document.getElementById('TT');
function showTT(e,r){
  document.getElementById('TH').textContent=r.icon+' '+r.name;
  document.getElementById('TB').textContent=r.desc;
  tt.classList.add('vis'); moveTT(e);
}
function moveTT(e){
  let x=e.clientX+14,y=e.clientY-6;
  if(x+225>window.innerWidth)x=e.clientX-230;
  if(y+90>window.innerHeight)y=e.clientY-100;
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTT(){tt.classList.remove('vis');}

function openMod(r){
  const hero=document.getElementById('MHERO');
  // Сначала показываем градиент, пока грузится фото
  hero.style.background=r.bg;
  // Загружаем фото
  if(r.photo){
    const img=new Image();
    img.onload=function(){
      hero.style.background=`url('${r.photo}') center/cover no-repeat`;
    };
    img.src=r.photo;
  }
  document.getElementById('MICO').textContent=r.icon;
  document.getElementById('MTIT').textContent=r.name;
  document.getElementById('MTXT').textContent=r.full;
  document.getElementById('MOD').classList.add('open');
}
document.getElementById('MX').addEventListener('click',()=>document.getElementById('MOD').classList.remove('open'));
document.getElementById('MOD').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});

init();
window.addEventListener('resize',()=>{document.querySelectorAll('.room').forEach(e=>e.remove());init();});
</script>
