<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Nunito:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
.w{width:100%;height:690px;position:relative;overflow:hidden;border-radius:18px;font-family:'Nunito',sans-serif;}

/* ===== ФОН: яркий, насыщенный, глубокий, сияющий ===== */
.bg{
position:absolute;inset:0;
background:
radial-gradient(ellipse 80% 60% at 20% 30%, rgba(64,224,208,0.35) 0%, transparent 55%),
radial-gradient(ellipse 60% 50% at 80% 20%, rgba(106,90,205,0.30) 0%, transparent 50%),
radial-gradient(ellipse 70% 55% at 65% 80%, rgba(80,200,120,0.28) 0%, transparent 52%),
radial-gradient(ellipse 50% 40% at 15% 75%, rgba(255,215,0,0.25) 0%, transparent 48%),
radial-gradient(ellipse 90% 80% at 50% 50%, rgba(0,127,255,0.22) 0%, transparent 100%),
radial-gradient(ellipse 40% 35% at 35% 65%, rgba(181,126,220,0.20) 0%, transparent 45%),
radial-gradient(ellipse 35% 30% at 75% 55%, rgba(0,255,255,0.18) 0%, transparent 40%),
linear-gradient(145deg, #e8f0ff 0%, #f0e6ff 18%, #e6fff5 35%, #fff5e6 52%, #f5e6ff 68%, #e6f0ff 85%, #e0f7fa 100%);
overflow:hidden;
}

.bg::before{
content:'';position:absolute;
inset:-60%;width:220%;height:220%;
background:conic-gradient(
from 0deg at 45% 48%,
rgba(64,224,208,0.28) 0deg,
rgba(0,127,255,0.32) 55deg,
rgba(80,200,120,0.26) 110deg,
rgba(255,215,0,0.22) 165deg,
rgba(230,230,250,0.30) 210deg,
rgba(106,90,205,0.28) 265deg,
rgba(181,126,220,0.24) 310deg,
rgba(64,224,208,0.28) 360deg
);
animation:bgSpin 28s linear infinite;
filter:blur(30px);
opacity:0.85;
}

.bg::after{
content:'';position:absolute;inset:0;
background:
radial-gradient(ellipse 55% 35% at 28% 35%, rgba(106,90,205,0.25) 0%, transparent 100%),
radial-gradient(ellipse 45% 30% at 72% 25%, rgba(0,127,255,0.22) 0%, transparent 100%),
radial-gradient(ellipse 40% 28% at 60% 78%, rgba(80,200,120,0.20) 0%, transparent 100%),
radial-gradient(ellipse 38% 25% at 15% 68%, rgba(255,215,0,0.18) 0%, transparent 100%),
radial-gradient(ellipse 30% 22% at 45% 45%, rgba(181,126,220,0.15) 0%, transparent 100%);
animation:bgPulse 10s ease-in-out infinite alternate;
}

@keyframes bgSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes bgPulse{0%{opacity:0.6;}100%{opacity:1.0;}}

.bg-light{
position:absolute;inset:0;z-index:1;
background:radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,255,255,0.55) 0%, transparent 65%);
pointer-events:none;
}

/* ===== ФОРМЫ В ФОНЕ ===== */
.bg-shapes{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.shape-container{
position:absolute;
opacity:0;
transition:opacity 2s ease-in-out;
filter:drop-shadow(0 0 20px rgba(255,215,0,0.4));
}
.shape-container.active{opacity:1;}
.shape-heart{width:280px;height:280px;animation:floatHeart 18s ease-in-out infinite;}
.shape-heart svg{width:100%;height:100%;}
.shape-wings{width:320px;height:200px;animation:floatWings 20s ease-in-out infinite;}
.shape-wings svg{width:100%;height:100%;}
.shape-hands{width:260px;height:260px;animation:floatHands 16s ease-in-out infinite;}
.shape-hands svg{width:100%;height:100%;}
.shape-sphere{width:240px;height:240px;animation:floatSphere 22s ease-in-out infinite;}
.shape-sphere svg{width:100%;height:100%;}

@keyframes floatHeart{0%,100%{transform:translate(10%,20%) rotate(-5deg) scale(1);}50%{transform:translate(15%,25%) rotate(5deg) scale(1.05);}}
@keyframes floatWings{0%,100%{transform:translate(60%,15%) rotate(0deg) scale(1);}50%{transform:translate(65%,18%) rotate(3deg) scale(1.03);}}
@keyframes floatHands{0%,100%{transform:translate(20%,60%) rotate(0deg) scale(1);}50%{transform:translate(25%,65%) rotate(-3deg) scale(1.04);}}
@keyframes floatSphere{0%,100%{transform:translate(65%,60%) rotate(0deg) scale(1);}50%{transform:translate(70%,65%) rotate(5deg) scale(1.06);}}

.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.9),transparent);box-shadow:0 0 8px rgba(255,215,0,0.8),0 0 16px rgba(255,215,0,0.4);animation:sparkle 3s ease-in-out infinite;}
@keyframes sparkle{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1.2);}}

.paths-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;}

/* ===== ЦЕНТР - неровная форма, компактный ===== */
.center{
position:absolute;
left:50%;top:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:8;
pointer-events:none;
width:240px;
height:240px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px 18px;
background:rgba(255,255,255,0.22);
backdrop-filter:blur(14px);
border:2px solid rgba(255,255,255,0.55);
box-shadow:
0 15px 50px rgba(106,90,205,0.22),
inset 0 0 35px rgba(255,255,255,0.45),
0 0 70px rgba(64,224,208,0.18);
animation:centerGlow 6s ease-in-out infinite, morphCenter 14s ease-in-out infinite;
border-radius:60% 40% 30% 70% / 60% 30% 70% 40%;
}

@keyframes centerGlow{
0%,100%{
box-shadow:
0 15px 50px rgba(106,90,205,0.22),
inset 0 0 35px rgba(255,255,255,0.45),
0 0 70px rgba(64,224,208,0.18);
}
50%{
box-shadow:
0 20px 60px rgba(64,224,208,0.32),
inset 0 0 45px rgba(255,255,255,0.65),
0 0 90px rgba(106,90,205,0.22);
}
}

@keyframes morphCenter{
0%,100%{border-radius:60% 40% 30% 70% / 60% 30% 70% 40%;}
25%{border-radius:40% 60% 50% 50% / 50% 50% 60% 40%;}
50%{border-radius:30% 60% 70% 40% / 50% 60% 30% 60%;}
75%{border-radius:50% 40% 60% 50% / 60% 40% 50% 50%;}
}

.c-title{
font-family:'Cormorant Garamond',serif;
font-size:32px;
font-weight:300;
color:#4a3a6a;
letter-spacing:1px;
line-height:1.05;
position:relative;
z-index:2;
text-shadow:
0 0 22px rgba(106,90,205,0.4),
0 2px 8px rgba(0,0,0,0.08);
animation:titleShine 4s ease-in-out infinite;
margin-bottom:5px;
}

@keyframes titleShine{
0%,100%{text-shadow:0 0 22px rgba(106,90,205,0.4),0 2px 8px rgba(0,0,0,0.08);}
50%{text-shadow:0 0 38px rgba(64,224,208,0.6),0 3px 14px rgba(0,0,0,0.12);}
}

.c-subtitle{
font-size:9px;
color:#7a6a9a;
letter-spacing:2.5px;
text-transform:uppercase;
margin-bottom:14px;
font-weight:300;
position:relative;
z-index:2;
}

.c-text{
font-size:13px;
color:#5a4a7a;
line-height:1.6;
margin-bottom:8px;
font-weight:300;
position:relative;
z-index:2;
}

.c-text p{
margin:6px 0;
animation:fadeInUp 1s ease-out backwards;
}

.c-text p:nth-child(1){animation-delay:0.2s;}
.c-text p:nth-child(2){animation-delay:0.4s;}
.c-text p:nth-child(3){animation-delay:0.6s;}
.c-text p:nth-child(4){animation-delay:0.8s;}

@keyframes fadeInUp{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.c-highlight{
color:#6a5acd;
font-weight:500;
position:relative;
display:inline-block;
}

.c-highlight::after{
content:'';
position:absolute;
bottom:-1px;
left:0;
width:100%;
height:1.5px;
background:linear-gradient(90deg,transparent,rgba(106,90,205,0.6),transparent);
animation:underlineGlow 3s ease-in-out infinite;
}

@keyframes underlineGlow{
0%,100%{opacity:0.5;}
50%{opacity:1;box-shadow:0 0 8px rgba(106,90,205,0.8);}
}

.c-heart{
font-size:18px;
color:#ff80c0;
margin:10px 0 6px;
position:relative;
z-index:2;
animation:hbeat 3s ease-in-out infinite;
}

@keyframes hbeat{
0%,100%{transform:scale(1);opacity:0.7;}
50%{transform:scale(1.2);opacity:1;text-shadow:0 0 18px rgba(255,128,192,0.8);}
}

.c-signature{
font-size:11px;
color:#8a7aaa;
font-style:italic;
margin-top:6px;
letter-spacing:1.5px;
position:relative;
z-index:2;
}

/* ===== КОМНАТЫ ===== */
.room{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:12;transition:transform 0.32s ease;}
.room:hover{transform:translate(-50%,-50%) scale(1.12);}
.room-clip-wrap{position:relative;}
.room-photo-bg{
position:absolute;inset:0;
background-size:cover;background-position:center;
transition:filter 0.3s ease;
}
.room-color-layer{position:absolute;inset:0;transition:opacity 0.3s ease;}
.room:hover .room-color-layer{opacity:0.15!important;}
.room-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9.5px;font-weight:600;color:#4a3a6a;text-shadow:0 1px 4px rgba(255,255,255,0.85),0 0 10px rgba(106,90,205,0.3);letter-spacing:0.03em;pointer-events:none;}
.room-glow{position:absolute;inset:-6px;border-radius:inherit;opacity:0;transition:opacity 0.3s;background:radial-gradient(circle,rgba(255,220,120,0.4),transparent 70%);z-index:-1;filter:blur(6px);}
.room:hover .room-glow{opacity:1;}

.footstep{
position:absolute;
width:8px;
height:14px;
pointer-events:none;
transform:translate(-50%,-50%);
opacity:0;
z-index:6;
filter:drop-shadow(0 0 4px rgba(255,215,0,0.8)) drop-shadow(0 0 8px rgba(255,215,0,0.4));
}
.footstep svg{width:100%;height:100%;}

.tooltip{position:fixed;background:rgba(255,255,255,0.95);border:1px solid rgba(106,90,205,0.25);border-radius:12px;padding:11px 15px;max-width:210px;z-index:400;box-shadow:0 10px 34px rgba(106,90,205,0.15);pointer-events:none;opacity:0;transition:opacity 0.16s;backdrop-filter:blur(8px);}
.tooltip.vis{opacity:1;}
.tt-head{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:500;color:#4a3a6a;margin-bottom:4px;}
.tt-body{font-size:11px;color:#6a5a8a;line-height:1.6;}

.modal-bg{position:fixed;inset:0;background:rgba(232,240,255,0.72);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.28s;backdrop-filter:blur(6px);}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{background:linear-gradient(160deg,#f8f0ff,#f0e6ff);border:1px solid rgba(106,90,205,0.25);border-radius:22px;max-width:360px;width:91%;position:relative;overflow:hidden;transform:translateY(18px) scale(0.94);transition:transform 0.28s;box-shadow:0 24px 70px rgba(106,90,205,0.15),0 0 60px rgba(106,90,205,0.08);}
.modal-bg.open .modal{transform:translateY(0) scale(1);}
.modal-hero{
width:calc(100% - 20px);
height:180px;
margin:10px;
background-size:cover;
background-position:center;
position:relative;
transition:background-image 0.3s;
filter:blur(1px) brightness(1.05);
border-radius:60% 40% 30% 70% / 60% 30% 70% 40%;
animation:morphEdges 12s ease-in-out infinite;
}
@keyframes morphEdges{
0%,100%{border-radius:60% 40% 30% 70% / 60% 30% 70% 40%;}
25%{border-radius:40% 60% 50% 50% / 50% 50% 60% 40%;}
50%{border-radius:30% 60% 70% 40% / 50% 60% 30% 60%;}
75%{border-radius:50% 40% 60% 50% / 60% 40% 50% 50%;}
}
.modal-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,0.1) 0%,rgba(240,230,255,0.3) 100%);border-radius:inherit;}
.modal-body{padding:14px 24px 26px;}
.modal-ico{font-size:26px;margin-bottom:6px;}
.modal-tit{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:#4a3a6a;margin-bottom:8px;text-shadow:0 0 20px rgba(106,90,205,0.15);}
.modal-txt{font-size:12.5px;color:#6a5a8a;line-height:1.8;}
.modal-close{position:absolute;top:10px;right:12px;background:rgba(240,230,255,0.88);border:1px solid rgba(106,90,205,0.2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#6a5a8a;cursor:pointer;z-index:10;transition:background 0.18s;}
.modal-close:hover{background:rgba(200,180,240,0.7);}

.legend{position:absolute;bottom:12px;right:14px;font-size:9px;color:#8a7aaa;line-height:2.1;letter-spacing:0.04em;}
.leg-row{display:flex;align-items:center;gap:5px;justify-content:flex-end;}
.fs-dot{display:inline-block;width:4px;height:6px;border-radius:40%;background:rgba(255,215,0,0.8);box-shadow:0 0 4px rgba(255,215,0,0.6);}
</style>

let W,ww,wh,cx,cy,fsPool=[];
function rp(r){return{x:r.px*ww,y:r.py*wh};}

function init(){
W=document.getElementById('W');
ww=W.offsetWidth; wh=W.offsetHeight;
cx=ww*0.5; cy=wh*0.5;
buildClipPaths();
drawPaths();
placeRooms();
buildFootstepPool();
startShapeRotation();
}

function buildClipPaths(){
const defs=document.getElementById('DEFS');
let html='';
rooms.forEach(r=>{
html+=`<clipPath id="clip-${r.id}"><path d="${r.shape}"/></clipPath>`;
});
defs.innerHTML=html;
}

function drawPaths(){
const svg=document.getElementById('SVG');
svg.setAttribute('viewBox',`0 0 ${ww} ${wh}`);
let d='';
rooms.forEach(r=>{
const p=rp(r);
const mx=(cx+p.x)/2,my=(cy+p.y)/2;
const dx=(p.y-cy)*0.13,dy=(cx-p.x)*0.13;
d+=`<path d="M${cx},${cy} Q${mx+dx},${my+dy} ${p.x},${p.y}" stroke="rgba(106,90,205,0.25)" stroke-width="1.5" fill="none" stroke-dasharray="3,7"/>`;
});
const existing=svg.innerHTML;
svg.innerHTML=existing+d;
}

function buildFootstepPool(){
for(let i=0;i<100;i++){
const el=document.createElement('div');
el.className='footstep';
el.innerHTML=`<svg viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
<path d="M12,2 C10,2 8,4 8,6 C8,8 9,9 10,10 C8,11 6,13 6,16 C6,19 8,22 12,22 C16,22 18,19 18,16 C18,13 16,11 14,10 C15,9 16,8 16,6 C16,4 14,2 12,2Z" fill="rgba(255,215,0,0.85)" stroke="rgba(255,255,255,0.6)" stroke-width="0.5"/>
<ellipse cx="12" cy="28" rx="8" ry="6" fill="rgba(255,215,0,0.7)" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>
</svg>`;
W.appendChild(el);
fsPool.push(el);
}
}

const active={};
function bezier(t,a,b,c){
const m=1-t;
return{x:m*m*a.x+2*m*t*b.x+t*t*c.x,y:m*m*a.y+2*m*t*b.y+t*t*c.y};
}

function walkTo(room){
if(active[room.id])return;
active[room.id]=true;
const p=rp(room);
const p0={x:cx,y:cy},p1={x:p.x,y:p.y};
const mx=(cx+p.x)/2,my=(cy+p.y)/2;
const dx=(p.y-cy)*0.13,dy=(cx-p.x)*0.13;
const cp={x:mx+dx,y:my+dy};
const N=20; const used=[];
let i=0;
function step(){
if(i>=N){
setTimeout(()=>{used.forEach(e=>{e.style.opacity='0';});active[room.id]=false;},700);
return;
}
const t=i/(N-1);
const pos=bezier(t,p0,cp,p1);
const el=fsPool[i%fsPool.length];
used.push(el);
const side=(i%2===0?-5:5)+(Math.random()-0.5)*3;
const rot=(Math.random()-0.5)*25;
el.style.cssText=`left:${pos.x+side}px;top:${pos.y}px;transform:translate(-50%,-50%) rotate(${rot}deg);opacity:0;transition:opacity 0.12s ease;`;
void el.offsetWidth;
el.style.opacity='1';
i++;
setTimeout(step,i<N/2?38:50);
}
step();
}

function placeRooms(){
document.querySelectorAll('.room').forEach(e=>e.remove());
rooms.forEach(r=>{
const p=rp(r);
const el=document.createElement('div');
el.className='room';
el.style.cssText=`left:${p.x}px;top:${p.y}px;`;
el.innerHTML=`
<div class="room-clip-wrap" style="width:${r.w}px;height:${r.h}px;position:relative;">
<svg width="${r.w}" height="${r.h}" style="position:absolute;inset:0;z-index:0;" viewBox="0 0 ${r.w} ${r.h}">
<defs><clipPath id="lc-${r.id}"><path d="${r.shape}"/></clipPath></defs>
<g clip-path="url(#lc-${r.id})">
<foreignObject width="${r.w}" height="${r.h}">
<div xmlns="http://www.w3.org/1999/xhtml" class="room-photo-bg" style="width:100%;height:100%;background:${r.bg};background-image:url('${r.photo}');"></div>
</foreignObject>
</g>
<g clip-path="url(#lc-${r.id})">
<rect width="${r.w}" height="${r.h}" fill="${r.color}"/>
</g>
<g clip-path="url(#lc-${r.id})">
<rect width="${r.w}" height="${r.h}" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
</g>
<g clip-path="url(#lc-${r.id})">
<ellipse cx="${r.w*0.35}" cy="${r.h*0.3}" rx="${r.w*0.22}" ry="${r.h*0.16}" fill="rgba(255,255,255,0.10)"/>
</g>
</svg>
<div class="room-glow" style="clip-path:path('${r.shape}');"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;">
<span style="font-size:22px;filter:drop-shadow(0 1px 5px rgba(0,0,0,0.3));">${r.icon}</span>
<span style="font-size:9px;font-weight:600;color:#4a3a6a;text-align:center;text-shadow:0 1px 6px rgba(255,255,255,0.85);margin-top:3px;padding:0 6px;line-height:1.25;">${r.name}</span>
</div>
</div>`;
el.addEventListener('mouseenter',e=>{walkTo(r);showTT(e,r);});
el.addEventListener('mousemove',moveTT);
el.addEventListener('mouseleave',hideTT);
el.addEventListener('click',()=>openMod(r));
W.appendChild(el);
});
}

const tt=document.getElementById('TT');
function showTT(e,r){
document.getElementById('TH').textContent=r.icon+' '+r.name;
document.getElementById('TB').textContent=r.desc;
tt.classList.add('vis'); moveTT(e);
}
function moveTT(e){
let x=e.clientX+14,y=e.clientY-6;
if(x+225>window.innerWidth)x=e.clientX-230;
if(y+90>window.innerHeight)y=e.clientY-100;
tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTT(){tt.classList.remove('vis');}

function openMod(r){
const hero=document.getElementById('MHERO');
hero.style.background=r.bg;
if(r.photo){
const img=new Image();
img.onload=function(){
hero.style.background=`url('${r.photo}') center/cover no-repeat`;
};
img.src=r.photo;
}
document.getElementById('MICO').textContent=r.icon;
document.getElementById('MTIT').textContent=r.name;
document.getElementById('MTXT').textContent=r.full;
document.getElementById('MOD').classList.add('open');
}

document.getElementById('MX').addEventListener('click',()=>document.getElementById('MOD').classList.remove('open'));
document.getElementById('MOD').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});

function startShapeRotation(){
const shapes=['shapeHeart','shapeWings','shapeHands','shapeSphere'];
const durations=[8000,10000,9000,11000];
let current=0;
function showNext(){
document.querySelectorAll('.shape-container').forEach(s=>s.classList.remove('active'));
const el=document.getElementById(shapes[current]);
el.classList.add('active');
addSparkles(el);
current=(current+1)%shapes.length;
setTimeout(showNext,durations[(current-1+shapes.length)%shapes.length]);
}
showNext();
}

function addSparkles(container){
container.querySelectorAll('.sparkle').forEach(s=>s.remove());
for(let i=0;i<8;i++){
const sparkle=document.createElement('div');
sparkle.className='sparkle';
sparkle.style.left=Math.random()*80+10+'%';
sparkle.style.top=Math.random()*80+10+'%';
sparkle.style.animationDelay=Math.random()*3+'s';
sparkle.style.animationDuration=(2+Math.random()*2)+'s';
container.appendChild(sparkle);
}
}

init();
window.addEventListener('resize',()=>{document.querySelectorAll('.room').forEach(e=>e.remove());init();});
</script>
